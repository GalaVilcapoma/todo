# ============================================================
# Secret — Credenciales y configuración sensible (Base64)
# ============================================================
# Crear:    kubectl apply -f PierreConca-05-secret.yml
# Eliminar: kubectl delete -f PierreConca-05-secret.yml
# Verificar: kubectl get secrets -n pierreconca-05-namespace
#
# ── Cómo convertir a Base64 ──────────────────────────────────
# Web:        https://base64.guru/converter
# PowerShell: [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("tu-valor"))
# Linux/Mac:  echo -n "tu-valor" | base64
#
# ── Valores decodificados (referencia) ───────────────────────
# MONGODB_DATABASE : db_avsa
# MONGODB_URI      : mongodb+srv://pierreconca_db_user:***@cluster0.kt6pnki.mongodb.net/db_avsa?retryWrites=true&w=majority&appName=Cluster0
# SERVER_PORT      : 8081   ← puerto del S4 Spring WebFlux
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: pierreconca-05-secret
  namespace: pierreconca-05-namespace
type: Opaque
stringData:
  # ── MongoDB (instancia EC2 - IP privada del cluster) ──────────
  # Formato EC2:   mongodb://<IP_PRIVADA_MONGO_EC2>:27017/db_avsa
  # Formato Atlas: mongodb+srv://user:pass@cluster.mongodb.net/db_avsa
  MONGODB_URI: "mongodb://<IP_PRIVADA_MONGO_EC2>:27017/db_avsa"
  MONGODB_DATABASE: "db_avsa"

  # ── SQL Server (Amazon RDS - Puerto 1433) ─────────────────────
  # Reemplaza <RDS_ENDPOINT> con el endpoint real de tu RDS
  # Ejemplo: avsa-db.abc123xyz.us-east-1.rds.amazonaws.com
  R2DBC_URL: "r2dbc:mssql://<RDS_ENDPOINT>:1433/avsa_db?trustServerCertificate=true"
  R2DBC_USERNAME: "sa"
  R2DBC_PASSWORD: "<TU_PASSWORD_SQL_SERVER>"

  # ── Puerto del servidor Spring WebFlux ────────────────────────
  SERVER_PORT: "8081"
