apiVersion: v1
kind: Namespace
metadata:
  name: anthonygala-08
---
apiVersion: v1
kind: Secret
metadata:
  name: anthonygala-08-secret
  namespace: anthonygala-08
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://pierreconca_db_user:concaflores31@cluster0.kt6pnki.mongodb.net/db_avsa?retryWrites=true&w=majority&appName=Cluster0"
  MONGODB_DATABASE: "db_avsa"
  R2DBC_URL: "r2dbc:mssql://ENDPOINT_RDS:1433/avsa_db?trustServerCertificate=true"
  R2DBC_USERNAME: "sa"
  R2DBC_PASSWORD: "Avsa1234"
  SQLSERVER_HOST: "ENDPOINT_RDS"
  SQLSERVER_PORT: "1433"
  SQLSERVER_DATABASE: "avsa_db"
  SQLSERVER_USER: "sa"
  SQLSERVER_PASSWORD: "Avsa1234"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: anthonygala-08-configmap
  namespace: anthonygala-08
data:
  SERVER_PORT: "8081"
  SPRING_APPLICATION_NAME: "spring-webflux-nosql"
  SPRINGDOC_API_DOCS_ENABLED: "true"
  SPRINGDOC_API_DOCS_PATH: "/v3/api-docs"
  SPRINGDOC_SWAGGER_UI_ENABLED: "true"
  SPRINGDOC_SWAGGER_UI_PATH: "/swagger-ui.html"
  PORT: "8000"
  DATABASE_NAME: "db_avsa"
  SQLSERVER_ENABLED: "true"
---
# ============================================================
# 1. BACKEND SPRING BOOT S4 (WebFlux)
# Aislamiento de nodo: role=backend
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anthonygala-08-backend
  namespace: anthonygala-08
  labels:
    app: avsa-backend
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avsa-backend
  template:
    metadata:
      labels:
        app: avsa-backend
        tier: backend
    spec:
      nodeSelector:
        role: backend
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
      dnsPolicy: None
      containers:
        - name: avsa-backend-s4
          image: anthonygala/avsa-backend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: anthonygala-08-configmap
            - secretRef:
                name: anthonygala-08-secret
          resources:
            requests:
              memory: "400Mi"
              cpu: "200m"
            limits:
              memory: "750Mi"
              cpu: "600m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: anthonygala-08-backend-service
  namespace: anthonygala-08
spec:
  type: NodePort
  selector:
    app: avsa-backend
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
---
# ============================================================
# 2. BACKEND ANALITICO FASTAPI PYTHON
# Aislamiento de nodo: role=analytics
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anthonygala-08-analytics
  namespace: anthonygala-08
  labels:
    app: avsa-analytics
    tier: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avsa-analytics
  template:
    metadata:
      labels:
        app: avsa-analytics
        tier: analytics
    spec:
      nodeSelector:
        role: analytics
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
      dnsPolicy: None
      containers:
        - name: avsa-analytics-python
          image: anthonygala/avsa-analytics:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: anthonygala-08-configmap
            - secretRef:
                name: anthonygala-08-secret
          resources:
            requests:
              memory: "150Mi"
              cpu: "100m"
            limits:
              memory: "350Mi"
              cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: anthonygala-08-analytics-service
  namespace: anthonygala-08
spec:
  type: NodePort
  selector:
    app: avsa-analytics
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000
---
# ============================================================
# 3. FRONTEND REACT
# Aislamiento de nodo: role=frontend
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anthonygala-08-frontend
  namespace: anthonygala-08
  labels:
    app: avsa-frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avsa-frontend
  template:
    metadata:
      labels:
        app: avsa-frontend
        tier: frontend
    spec:
      nodeSelector:
        role: frontend
      containers:
        - name: avsa-frontend-react
          image: anthonygala/avsa-frontend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: API_URL
              value: "http://IP_PUBLICA_NODO:30081"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: anthonygala-08-frontend-service
  namespace: anthonygala-08
spec:
  type: NodePort
  selector:
    app: avsa-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
