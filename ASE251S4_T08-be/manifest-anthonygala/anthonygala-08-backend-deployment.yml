apiVersion: apps/v1
kind: Deployment
metadata:
  name: anthonygala-08-backend
  namespace: anthonygala-08
  labels:
    app: avsa-backend
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avsa-backend
  template:
    metadata:
      labels:
        app: avsa-backend
        tier: backend
    spec:
      # Aislamiento de nodos (Node Isolation)
      nodeSelector:
        role: backend
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
      dnsPolicy: None
      containers:
        - name: avsa-backend-s4
          image: anthonygala/avsa-backend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: anthonygala-08-configmap
            - secretRef:
                name: anthonygala-08-secret
          resources:
            requests:
              memory: "400Mi"
              cpu: "200m"
            limits:
              memory: "750Mi"
              cpu: "600m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: anthonygala-08-backend-service
  namespace: anthonygala-08
  labels:
    app: avsa-backend
spec:
  type: NodePort
  selector:
    app: avsa-backend
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
