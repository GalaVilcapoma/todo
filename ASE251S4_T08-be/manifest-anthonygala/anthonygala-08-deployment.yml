apiVersion: apps/v1
kind: Deployment
metadata:
  name: anthonygala-08-deployment
  namespace: anthonygala-08
  labels:
    app: spring-webflux-app
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-webflux-app
  template:
    metadata:
      labels:
        app: spring-webflux-app
        version: v1
    spec:
      containers:
      - name: spring-webflux-container
        image: anthonygala/springboot-webflux-mongodb:1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          protocol: TCP
        env:
        # Variables desde ConfigMap
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: anthonygala-08-configmap
              key: SERVER_PORT
        - name: SPRING_APPLICATION_NAME
          valueFrom:
            configMapKeyRef:
              name: anthonygala-08-configmap
              key: SPRING_APPLICATION_NAME
        # Variables desde Secret
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: anthonygala-08-secret
              key: MONGODB_URI
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
