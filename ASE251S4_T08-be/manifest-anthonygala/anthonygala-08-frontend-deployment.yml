apiVersion: apps/v1
kind: Deployment
metadata:
  name: anthonygala-08-frontend
  namespace: anthonygala-08
  labels:
    app: avsa-frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avsa-frontend
  template:
    metadata:
      labels:
        app: avsa-frontend
        tier: frontend
    spec:
      # Aislamiento de nodos (Node Isolation)
      nodeSelector:
        role: frontend
      containers:
        - name: avsa-frontend-react
          image: anthonygala/avsa-frontend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            # ⚠️ Reemplazar IP_PUBLICA_NODO con la IP publica de tu EC2 worker o master
            - name: API_URL
              value: "http://IP_PUBLICA_NODO:30081"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: anthonygala-08-frontend-service
  namespace: anthonygala-08
  labels:
    app: avsa-frontend
spec:
  type: NodePort
  selector:
    app: avsa-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
