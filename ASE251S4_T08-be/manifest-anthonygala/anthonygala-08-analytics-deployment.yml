apiVersion: apps/v1
kind: Deployment
metadata:
  name: anthonygala-08-analytics
  namespace: anthonygala-08
  labels:
    app: avsa-analytics
    tier: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avsa-analytics
  template:
    metadata:
      labels:
        app: avsa-analytics
        tier: analytics
    spec:
      # Aislamiento de nodos (Node Isolation)
      nodeSelector:
        role: analytics
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
      dnsPolicy: None
      containers:
        - name: avsa-analytics-python
          image: anthonygala/avsa-analytics:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: anthonygala-08-configmap
            - secretRef:
                name: anthonygala-08-secret
          resources:
            requests:
              memory: "150Mi"
              cpu: "100m"
            limits:
              memory: "350Mi"
              cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: anthonygala-08-analytics-service
  namespace: anthonygala-08
  labels:
    app: avsa-analytics
spec:
  type: NodePort
  selector:
    app: avsa-analytics
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30000
