apiVersion: v1
kind: Service
metadata:
  name: anthonygala-08-service
  namespace: anthonygala-08
  labels:
    app: spring-webflux-app
spec:
  type: LoadBalancer
  selector:
    app: spring-webflux-app
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8081
  sessionAffinity: None
