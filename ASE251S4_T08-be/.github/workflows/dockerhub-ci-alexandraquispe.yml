name: Docker Hub - Alexandra Quispe

on:
  push:
    branches:
      - develop
      - webflux-nosql
      - main
  pull_request:
    branches:
      - develop
      - webflux-nosql
      - main
  schedule:
    # Ejecutar todos los días a las 8:00 AM hora Perú (UTC-5) → 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:  # Permite ejecución manual desde GitHub Actions UI

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # 2. Login a Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_ALEXANDRAQUISPE }}
          password: ${{ secrets.DOCKERHUB_TOKEN_ALEXANDRAQUISPE }}
      
      # 3. Build y Push con tags latest y SHA
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile-alexandraquispe/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_ALEXANDRAQUISPE }}/avsa-backend:1.0
            ${{ secrets.DOCKERHUB_USERNAME_ALEXANDRAQUISPE }}/avsa-backend:${{ github.sha }}

# CI PIPELINE GITHUB + DOCKERHUB
# Alexandra Quispe - ASE251S4_T08
